<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Superbrain</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <header>
      <h1>Superbrain</h1>
      <p class="sub">Claude writes the lesson. ElevenLabs reads it to you.</p>
    </header>

    <form id="lesson-form">
      <label>Language
        <input name="language" list="languages" value="Mandarin Chinese" required />
        <datalist id="languages">
          <option>Mandarin Chinese</option>
          <option>Japanese</option>
          <option>Spanish</option>
          <option>French</option>
          <option>German</option>
          <option>Italian</option>
        </datalist>
      </label>
      <label>Level
        <select name="level">
          <option>beginner</option>
          <option selected>intermediate (about HSK 3 / A2–B1)</option>
          <option>advanced</option>
        </select>
      </label>
      <label class="wide">Topic
        <input name="topic" placeholder="e.g. ordering coffee, talking about my work, train travel" />
      </label>
      <label>Phrases
        <input name="count" type="number" min="1" max="20" value="8" />
      </label>
      <button type="submit">Generate lesson</button>
    </form>

    <section id="lesson" hidden>
      <div class="lesson-head">
        <h2 id="lesson-title"></h2>
        <div class="controls">
          <label class="inline"><input type="checkbox" id="slow" /> Slow</label>
          <label class="inline"><input type="checkbox" id="show-translation" checked /> Translations</label>
          <button id="play-all" type="button">▶ Play all</button>
        </div>
      </div>
      <ol id="phrases"></ol>
    </section>

    <p id="status" role="status"></p>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
